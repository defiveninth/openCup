name: ordercup

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ordercup
      POSTGRES_USER: ordercup
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    command:
      ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40"]
    volumes:
      - ordercup_pgdata:/var/lib/postgresql
    networks: [data]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordercup -d ordercup"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  tooling:
    image: ordercup-tooling:${RELEASE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
      target: tooling
    profiles: [tools]
    environment:
      DATABASE_URL: postgres://ordercup:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/ordercup
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      SEED_PASSWORD: ${SEED_PASSWORD:?Set SEED_PASSWORD}
      NODE_ENV: production
    depends_on:
      db: { condition: service_healthy }
    networks: [data]
    mem_limit: 512m
    cpus: 0.5

  web:
    image: ordercup-web:${RELEASE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgres://ordercup:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/ordercup
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      NODE_ENV: production
    depends_on:
      db: { condition: service_healthy }
    networks: [data, proxy]
    mem_limit: 512m
    cpus: 0.75
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik_net
      traefik.http.routers.ordercup.rule: Host(`ordercup.duckdns.org`)
      traefik.http.routers.ordercup.entrypoints: websecure
      traefik.http.routers.ordercup.tls: "true"
      traefik.http.routers.ordercup.tls.certresolver: myresolver
      traefik.http.routers.ordercup.tls.domains[0].main: ordercup.duckdns.org
      traefik.http.routers.ordercup.service: ordercup
      traefik.http.services.ordercup.loadbalancer.server.port: "3000"
      traefik.http.services.ordercup.loadbalancer.responseforwarding.flushinterval: "-1ms"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  data:
    internal: true
  proxy:
    external: true
    name: traefik_net

volumes:
  ordercup_pgdata:
