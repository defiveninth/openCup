services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: table_thyme
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - restaurant_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d table_thyme"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  restaurant_postgres:
